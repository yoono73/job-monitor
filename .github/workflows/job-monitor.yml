name: Job Monitor

on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        env:
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          ALIO_API_KEY:        ${{ secrets.ALIO_API_KEY }}
          EMAIL_TO_ADMIN:      ${{ secrets.EMAIL_TO_ADMIN }}
          NARAIJARI_API_KEY:   ${{ secrets.NARAIJARI_API_KEY }}
          PYTHONUNBUFFERED:    "1"
          SKIP_KRID:           "1"
        run: python job_monitor.py

      - name: Save seen IDs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "chore: update seen_ids [skip ci]"
          git push