name: Job Monitor

on:
  schedule:
    - cron: '0 22 * * 0-4'   # KST 07:00 ??湲?    - cron: '0 1 * * 1-5'    # KST 10:00 ????(??湲??ㅼ쟾 ?섏쭛 蹂댁셿)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        env:
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          NARAIJARI_API_KEY:   ${{ secrets.NARAIJARI_API_KEY }}
          EMAIL_TO_ADMIN:      ${{ secrets.EMAIL_TO_ADMIN }}
          PYTHONUNBUFFERED:    "1"
        run: python job_monitor.py

      - name: Save results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json run_stats.json logs/
          git diff --staged --quiet || git commit -m "chore: update seen_ids + logs [skip ci]"
          git push